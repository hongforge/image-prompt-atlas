id: alpine-rescue-climax-shot
title: 高山救援高潮镜头
summary: 在极端高度、直升机气流和人物接触瞬间中建立清晰的救援动作逻辑。
taxonomy:
  deliverable: [film-storyboard, scene-storytelling]
