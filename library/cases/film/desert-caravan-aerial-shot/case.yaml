id: desert-caravan-aerial-shot
title: 盐湖车队航拍建立镜头
summary: 以车队轨迹、盐湖尺度和崖壁城市建立宏大的远征地理关系。
taxonomy:
  deliverable: [film-storyboard, scene-storytelling]
