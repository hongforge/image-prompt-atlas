    prop_function:
      zh: 传奇级治疗药剂，瓶体需要可安全抓握、可密封运输，并通过红色液体表达恢复生命的功能
      en: A legendary healing potion with a grippable, transport-safe sealed form and crimson liquid communicating health recovery
    material_stack:
      zh: 切面深红玻璃、做旧黄铜护笼、深棕皮革握带和暗红蜡封，所有连接点必须可制造
      en: Faceted crimson glass, aged brass protective cage, dark brown leather grip, and oxblood wax seal with manufacturable joints
    wear_level:
      zh: 中度使用痕迹集中在金属边缘和皮革握持区，玻璃主体保持完整透明，不出现随机裂纹
      en: Moderate wear limited to brass edges and leather grip zones, with intact transparent glass and no random cracks
    rarity_palette:
      zh: 暗红占 45%，旧黄铜占 30%，炭黑占 20%，低亮青色轮廓光占 5%
      en: 45% oxblood, 30% aged brass, 20% charcoal, and 5% low-intensity teal rim light
