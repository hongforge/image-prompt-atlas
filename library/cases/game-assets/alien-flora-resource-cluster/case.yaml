id: alien-flora-resource-cluster
title: 异星荧光植物资源簇
summary: 以透明叶片、种荚和抓地根系设计可识别、可采集的外星生态资源。
taxonomy:
  deliverable: [game-asset]
  medium: [3d-render, mixed-media]
  workflow: [text-to-image]
  capability: [material-lighting, spatial-reasoning, instruction-following]
