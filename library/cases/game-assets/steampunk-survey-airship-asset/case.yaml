    material_presentation:
      zh: 粗织深青气囊、旧黄铜、铆接黑铁和弧面玻璃分区清晰，在中性云层背景中以暖侧逆光展示
      en: Clearly separate coarse teal fabric, aged brass, riveted black iron, and curved glass against neutral clouds with warm side backlight
