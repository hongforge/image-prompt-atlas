      zh: 小型蒸汽勘测飞艇，深青椭圆气囊、黄铜玻璃观测舱、双侧涡轮和折叠尾翼形成完整识别轮廓
      en: A compact survey airship defined by a dark-teal oval balloon, brass-and-glass observation gondola, twin side turbines, and folding tail fins
