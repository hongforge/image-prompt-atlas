      zh: "琥珀玻璃、白色纤维和浅蓝细纹纸形成临床清洁感，图形仅使用细圆弧，不出现剂量、功效或医疗文字"
      en: "Amber glass, white fiber, and pale-blue textured paper create clinical clarity, using only fine arcs without dosage, efficacy, or medical copy"
